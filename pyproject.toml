[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "license-doctor"
version = "0.1.0"
description = "Production-grade CLI to scan, validate, and autofix SPDX license headers and copyright compliance."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "slopggobblercobbler81" }
]
keywords = [
    "spdx",
    "license",
    "license-checker",
    "compliance",
    "cli",
    "copyright",
    "autofix",
    "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.0.0",
    "rich>=12.0.0",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
license-doctor = "license_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["license_doctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.license-doctor]
license = "MIT"
owner = "slopggobblercobbler81"
target_year = 2026
exclude = [
    "tests/fixtures",
    ".git",
    "dist",
    "build",
    "*.egg-info",
]
