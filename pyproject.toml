[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "license-doctor"
version = "0.1.0"
description = "Production-grade SPDX license identifier validator, header auditor, and compatibility checker for CI/CD."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "slopggobblercobbler81" }
]
keywords = [
    "license",
    "spdx",
    "compliance",
    "open-source",
    "auditor",
    "compatibility",
    "cli",
    "linter",
    "developer-tools",
    "ci"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
license-doctor = "license_doctor.cli:main"
spdx-doctor = "license_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/slopggobblercobbler81/license-doctor"
Repository = "https://github.com/slopggobblercobbler81/license-doctor"
Issues = "https://github.com/slopggobblercobbler81/license-doctor/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["."]
include = ["license_doctor*"]
